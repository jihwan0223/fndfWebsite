<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIHWAN — Project</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="logo" href="index.html">JIHWAN<span class="accent">_</span></a>
  <nav class="nav">
    <a href="index.html#projects">← 프로젝트 목록</a>
    <a href="pdf.html" class="accent">전체 PDF</a>
  </nav>
</header>

<main class="deck" id="deck"></main>

<script src="projects.js"></script>
<script>
  const id = new URLSearchParams(location.search).get('id');
  const idx = PROJECTS.findIndex((p) => p.id === id);
  const deck = document.getElementById('deck');

  if (idx === -1) {
    deck.innerHTML = '<p>프로젝트를 찾을 수 없습니다. <a class="accent" href="index.html#projects">목록으로</a></p>';
  } else {
    const p = PROJECTS[idx];
    const next = PROJECTS[(idx + 1) % PROJECTS.length];
    document.title = `${p.title} — JIHWAN`;
    deck.innerHTML = renderDeck((pg) => pg.project === p) + `
      <a class="next-project" href="project.html?id=${next.id}">
        <span>NEXT PROJECT</span>
        <strong>${next.title} →</strong>
      </a>`;
  }
</script>
</body>
</html>
