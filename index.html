<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정지환 — 게임 개발자 포트폴리오</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="플레이어가 기억할 순간을 만드는 게임 개발자 정지환의 포트폴리오.">
<meta property="og:title" content="정지환 — 게임 개발자 포트폴리오">
<meta property="og:description" content="Unity · C# 게임 개발자 정지환의 프로젝트와 트러블슈팅 기록.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <a class="logo" href="#about">정지환</a>
  <nav class="nav">
    <a href="#about">소개</a>
    <a href="#history">이력</a>
    <a href="#skills">기술 스택</a>
    <a href="#projects">프로젝트</a>
  </nav>
</header>

<main>
  <!-- 자기소개: 인사 · 소개 · 연락처 + 이력 → 기술 스택 → 프로젝트 -->
  <section class="intro" id="about">
    <div class="intro-head">
      <div class="intro-id">
        <div class="img-slot profile-photo" data-path="images/profile/photo.jpg">
          <img src="images/profile/photo.jpg" alt="정지환 사진" onerror="this.remove()">
        </div>
        <div>
          <p class="hero-role">게임 개발자</p>
          <h1 class="hero-title">안녕하세요,<br>정지환입니다.</h1>
        </div>
      </div>
      <div>
        <p class="hero-sub">플레이어가 기억할 순간을 만드는 게임을 만듭니다.</p>
        <p class="about-text">
          자기소개가 들어갈 자리입니다. 어떤 게임을 만들고 싶은지,
          무엇을 중요하게 생각하는 개발자인지 두세 문장으로 적어 주세요.
        </p>
        <!-- 신상 한 줄씩: 아이콘 + 내용 (흐린 줄 = 아직 채울 자리) -->
        <ul class="intro-contact">
          <li><svg viewBox="0 0 24 24" aria-label="이메일"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><a href="mailto:jihwan5580@gmail.com">jihwan5580@gmail.com</a></li>
          <li><svg viewBox="0 0 24 24" aria-label="깃허브"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg><a href="https://github.com/jihwan0223" target="_blank" rel="noopener">github.com/jihwan0223</a></li>
          <li><svg viewBox="0 0 24 24" aria-label="학교"><path d="M22 10 12 5 2 10l10 5zM22 10v6M6 12v5c3 3 9 3 12 0v-5"/></svg>경북소프트웨어마이스터고등학교 게임개발과</li>
          <li><svg viewBox="0 0 24 24" aria-label="수상"><circle cx="12" cy="8" r="6"/><path d="M15.48 12.89 17 22l-5-3-5 3 1.52-9.11"/></svg>2026 시니어 인지기능 향상 해커톤 <b class="accent">우수상</b></li>
        </ul>
        <p class="intro-links"><a href="#history">자세한 이력 ↓</a><a href="#projects">프로젝트 보기 ↓</a></p>
      </div>
    </div>

    <!-- 이력: 경력 · 학력 / 산학 프로젝트 / 대외활동 (projects.js PROFILE.history 에서 채움) -->
    <span id="history" class="anchor"></span>
    <div class="cv" id="historyList"></div>
  </section>

  <section class="section" id="skills">
    <h2 class="section-title">기술 스택</h2>
    <div class="skills-card"><dl class="skills" id="skillList"></dl></div>
  </section>

  <section class="section" id="projects">
    <h2 class="section-title">프로젝트</h2>
    <!-- 내용은 projects.js 에서 채움 -->
    <div class="project-list" id="projectList"></div>
  </section>

  <footer class="footer">© 2026 정지환</footer>
</main>

<!-- 스크롤 연출 (GSAP + ScrollTrigger), 부드러운 스크롤 (Lenis) - 못 불러와도 페이지는 그대로 보임 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="projects.js"></script>
<script src="script.js"></script>
</body>
</html>
